<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmar recebimento · VX Case</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#eef0f4;color:#1b2230}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.top{background:#102844;color:#fff;padding:22px 18px 16px}.top b{font-size:19px;display:block}.top span{font-size:12.5px;color:#cfe0f3}
.top.ok{background:#14532d}
.body{padding:16px 18px 24px;flex:1;display:flex;flex-direction:column}
.info{background:#f1f5fa;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.55}.info b{font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
input{width:100%;border:1.5px solid #b8c4d4;border-radius:10px;padding:13px;font-size:16px;background:#fff}
input:focus{outline:none;border-color:#102844}
.hint{font-size:11.5px;color:#667;margin-top:10px;line-height:1.4}
.erro{font-size:13px;color:#c0303c;font-weight:700;margin-top:12px;display:none;line-height:1.4}
button{margin-top:22px;background:#16a34a;color:#fff;font-weight:800;font-size:16px;padding:16px;border:0;border-radius:12px;width:100%;letter-spacing:.3px}
button:disabled{background:#9aa6b6}
.ok-box{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.chk{width:100px;height:100px;border-radius:50%;background:#16a34a;color:#fff;font-size:64px;display:flex;align-items:center;justify-content:center}
.ok-box h3{margin:18px 0 4px;font-size:22px;color:#14532d}.ok-box p{margin:3px 0;font-size:14px}
.dados{margin-top:16px;width:100%;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;text-align:left;font-size:13.5px;line-height:1.6}
.msg{padding:40px 22px;text-align:center;font-size:15px;line-height:1.5;color:#445}
</style></head><body><div class="wrap" id="app"><div class="msg">Carregando...</div></div>
<script>
const SB="https://llfiwklxinautxoujpre.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZml3a2x4aW5hdXR4b3VqcHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MDUzNTAsImV4cCI6MjEwNDQ4MTM1MH0.3dLtdv0Hvf93jXQHy2mjOTr4BJoCMHF_MzwUVEI5o38";
const T=new URLSearchParams(location.search).get('t')||'';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(fn,body){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}
const dh=iso=>{const d=new Date(iso);return d.toLocaleDateString('pt-BR',{timeZone:'America/Bahia'})+' às '+d.toLocaleTimeString('pt-BR',{timeZone:'America/Bahia',hour:'2-digit',minute:'2-digit'});};
function msg(t){app.innerHTML='<div class="top"><b>Confirmar recebimento</b><span>VX Case · Controle de Envios</span></div><div class="msg">'+t+'</div>';}
function feito(nome,filial,em,ja){
  app.innerHTML='<div class="top ok"><b>Recebimento confirmado</b><span>'+(ja?'Este envio já havia sido confirmado':'Obrigado!')+'</span></div><div class="body ok-box"><div class="chk">✓</div><h3>Confirmado</h3>'+
  '<div class="dados"><b>'+esc(nome)+'</b> · filial '+esc(filial)+'<br>'+dh(em)+'</div><p style="margin-top:16px;font-size:12.5px;color:#667">Já pode abrir a caixa.</p></div>';
}
async function init(){
  if(!T){ msg('QR inválido. Escaneie novamente a etiqueta da caixa.'); return; }
  let i; try{ i=await rpc('qr_info',{p_token:T}); }catch(e){ msg('Sem conexão. Verifique a internet e escaneie de novo.'); return; }
  if(!i||!i.ok){ msg('Etiqueta não encontrada. Confira se o QR é desta caixa.'); return; }
  if(i.confirmado){ feito(i.receb_nome,i.receb_filial,i.receb_em,true); return; }
  if(i.bloqueado){ msg('Muitas tentativas incorretas. Procure o setor de logística da VX Case.'); return; }
  app.innerHTML='<div class="top"><b>Confirmar recebimento</b><span>VX Case · Controle de Envios</span></div><div class="body">'+
   '<div class="info"><b>'+esc(i.dest)+'</b><br>Movimento '+esc(i.movimento||'—')+' · '+esc(i.vol||'')+' volume(s) · NF '+esc(i.nf||'—')+'</div>'+
   '<label for="n">Seu nome</label><input id="n" autocomplete="name" placeholder="Nome e sobrenome">'+
   '<label for="f">Número da sua filial</label><input id="f" inputmode="numeric" autocomplete="off" placeholder="Ex.: 485">'+
   '<label for="g">Nome do gestor da loja</label><input id="g" autocomplete="off" placeholder="Nome do gestor">'+
   '<div class="hint">A filial e o gestor precisam bater com o cadastro da loja. Só quem trabalha nela sabe.</div>'+
   '<div class="erro" id="e"></div><button id="b">CONFIRMAR RECEBIMENTO</button></div>';
  document.getElementById('b').onclick=async()=>{
    const n=document.getElementById('n').value.trim(),f=document.getElementById('f').value.trim(),g=document.getElementById('g').value.trim(),e=document.getElementById('e'),b=document.getElementById('b');
    e.style.display='none';
    if(n.length<3||!f||!g){ e.textContent='Preencha seu nome, a filial e o nome do gestor.'; e.style.display='block'; return; }
    b.disabled=true; b.textContent='Confirmando...';
    try{
      const r=await rpc('qr_confirmar',{p_token:T,p_nome:n,p_filial:f,p_gestor:g});
      if(r.ok){ feito(r.receb_nome,r.receb_filial,r.receb_em,r.ja); return; }
      if(r.erro==='bloqueado'){ msg('Muitas tentativas incorretas. Procure o setor de logística da VX Case.'); return; }
      e.textContent=r.erro==='nome'?'Digite seu nome completo.':'Filial ou gestor não conferem com este envio. Confira e tente de novo.'+(r.restantes!=null?' ('+r.restantes+' tentativas restantes)':'');
    }catch(x){ e.textContent='Não consegui enviar. Verifique a internet e tente de novo.'; }
    e.style.display='block'; b.disabled=false; b.textContent='CONFIRMAR RECEBIMENTO';
  };
}
init();
</script></body></html>
