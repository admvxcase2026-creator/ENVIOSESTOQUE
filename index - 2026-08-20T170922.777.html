<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Envios</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}</script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e222e;--border:#2a2f3d;--txt:#e6e8ee;--txt2:#9aa3b2;--accent:#3b82f6;--ok:#22c55e;--late:#f87171;--warn:#fbbf24;--info:#60a5fa;--purple:#a855f7;--g-id:#3b82f6;--g-ana:#a855f7;--g-peso:#22c55e;--g-fat:#f59e0b;--g-ent:#06b6d4;--zebra:rgba(255,255,255,.02)}
[data-theme="light"]{--bg:#f4f5f8;--panel:#fff;--panel2:#eef1f6;--border:#d8dde6;--txt:#1a1d26;--txt2:#5a6474;--zebra:rgba(0,0,0,.025)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;display:flex;flex-direction:column;height:100vh}
/* LOGIN */
.login{flex:1;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:min(380px,92vw)}
.login-box h2{font-size:18px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.login-box p{color:var(--txt2);font-size:12px;margin-bottom:20px}
.login-box label{display:block;font-size:11px;color:var(--txt2);text-transform:uppercase;margin:12px 0 4px}
.login-box input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:11px;border-radius:8px}
.login-box button{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:18px}
.login-err{color:var(--late);font-size:12px;margin-top:12px;min-height:16px}
/* APP */
.topbar{background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.tb-row{display:flex;align-items:center;justify-content:space-between;padding:11px 22px}
.brand{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.tb-tools{display:flex;gap:10px;align-items:center}
.search{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:8px 14px;border-radius:8px;width:180px}
.whoami{font-size:12px;color:var(--txt2);background:var(--panel2);border:1px solid var(--border);padding:6px 12px;border-radius:20px}
.whoami b{color:var(--txt)}
.tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer}
.topnav{display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.topnav a{padding:12px 16px;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap}
.topnav a.active{color:var(--txt);border-bottom-color:var(--accent)}
.topnav a:hover{color:var(--txt)}
.main{flex:1;padding:18px 22px;overflow:hidden;display:flex;flex-direction:column}
.view-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px}
.view-head h1{font-size:19px;font-weight:600}
.view-head p{color:var(--txt2);font-size:12px;margin-top:2px}
.datebar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);padding:8px 12px;border-radius:10px}
.datebar label{font-size:11px;color:var(--txt2);text-transform:uppercase}
.datebar input{background:var(--panel2);border:1px solid var(--accent);color:var(--txt);padding:7px 10px;border-radius:7px}
.dowtag{font-size:11px;font-weight:700;color:var(--accent)}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.chip .d{width:8px;height:8px;border-radius:2px}.chip.off{opacity:.4;text-decoration:line-through}
.grid-wrap{flex:1;overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;font-size:12px}
th,td{padding:6px 10px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
td.lft,th.lft{text-align:left}
table.tbl-est,table.tbl-fin{width:auto}
.grid-wrap.fit{flex:0 1 auto;align-self:center;width:fit-content;max-width:100%;max-height:100%}
.wfil{width:56px}
.wdest{width:188px;max-width:188px}
.wdestf{width:230px;max-width:230px;text-align:center}
.wsm{width:88px}
.wq{width:104px}
.wnum{width:74px}
.wnf{width:92px;max-width:92px}
.wdata{width:80px}
.wfat{width:110px}
.wpdf{width:96px}
.wdest,.wdestf{white-space:normal}
.grp-th{text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#fff;cursor:pointer;position:sticky;top:0;z-index:6}
.grp-th span{opacity:.7;font-size:9px;margin-left:4px}
.g-id{background:var(--g-id)}.g-ana{background:var(--g-ana)}.g-peso{background:var(--g-peso)}.g-fat{background:var(--g-fat)}.g-ent{background:var(--g-ent)}
thead tr.sub th{position:sticky;top:25px;z-index:5;background:var(--panel2);color:var(--txt);font-size:10px;font-weight:700;text-transform:uppercase}
thead tr.solo th{position:sticky;top:0;z-index:5;background:var(--panel2);color:var(--txt2);font-size:10px;font-weight:600;text-transform:uppercase}
.freeze{position:sticky;left:0;z-index:4;background:var(--panel);max-width:190px;white-space:normal;text-align:center}
th.freeze{z-index:7;background:var(--panel2)}
tbody tr:nth-child(even) .freeze{background:var(--panel)}
tbody tr:hover td{background:var(--panel2)}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.calc{background:transparent}
.dest{font-weight:600;text-align:center}.sub-row td{background:rgba(168,85,247,.04)}
.subtag{color:var(--purple);margin-right:4px}.princ{color:var(--warn);margin-right:4px}
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.b-ok{background:rgba(34,197,94,.15);color:var(--ok)}.b-late{background:rgba(248,113,113,.15);color:var(--late)}
.b-fat{background:rgba(245,158,11,.15);color:var(--warn)}.b-info{background:rgba(96,165,250,.15);color:var(--info)}
.b-off{background:rgba(154,163,178,.12);color:var(--txt2)}.b-purple{background:rgba(168,85,247,.15);color:var(--purple)}
.money{font-variant-numeric:tabular-nums}
.ci{width:100%;min-width:44px;text-align:center;background:transparent;border:1px solid transparent;color:var(--txt);padding:3px 4px;border-radius:5px;font-size:12px;font-variant-numeric:tabular-nums}
.ci:hover{border-color:var(--border);background:var(--panel2)}.ci:focus{border-color:var(--accent);background:var(--panel2);outline:none}
.ci.num{text-align:center}.ci.txt{text-align:left}select.ci{cursor:pointer}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fixrow td{background:transparent}
.fixname{font-weight:700;color:var(--txt)}
.subst{cursor:help;color:var(--purple);margin-left:5px;font-size:11px}
.qbtn{background:var(--panel2);border:1px solid var(--accent);color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;margin-left:6px}
.xbtn{cursor:pointer;color:var(--txt2);font-size:11px;padding:1px 4px;border-radius:4px}
.xbtn:hover{color:var(--late);background:var(--panel2)}
.anasel{font-weight:600;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;padding-right:4px}
select.anasel:hover,select.anasel:focus{-webkit-appearance:auto;appearance:auto;padding-right:18px}
.wqt{width:52px}
.wnfa{width:96px}
.wana{width:152px}
.wtr{width:128px}
.wdr{width:124px}
.wrast{width:150px}
.wqa{width:70px}
.wmc{width:104px}
.rotxt{font-weight:500}
.st-transit{background:rgba(234,179,8,.16);color:#c99a1e}
.st-ok{background:rgba(34,197,94,.18);color:#22c55e}
.st-late{background:rgba(239,68,68,.15);color:#e08a8a}
.xdel{cursor:pointer;color:var(--txt2);font-size:11px;padding:1px 4px;border-radius:4px;opacity:0;transition:opacity .12s}
tr:hover .xdel{opacity:1}
.xdel:hover{color:var(--late);background:var(--panel2)}
.lockbtn{cursor:pointer;font-size:12px;margin-left:4px}
.libgrid{display:flex;flex-wrap:wrap;gap:14px}
.libcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:240px;max-width:320px}
.libcard-h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px}
.librow{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px;border-bottom:1px solid var(--border)}
".librow:last-child{border-bottom:0}
.tgrid{display:flex;flex-wrap:wrap;gap:14px}
.tcard{cursor:pointer;border-radius:12px;padding:14px 16px;width:180px;border:1px solid var(--border);transition:transform .08s}
.tcard:active{transform:scale(.98)}
.tcard-nome{font-weight:800;font-size:15px}
.tcard-sub{font-size:12px;opacity:.75;margin-top:3px}
.tcard-badge{display:inline-block;margin-top:8px;background:rgba(0,0,0,.25);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.tc-laranja{background:rgba(249,115,22,.18);border-color:rgba(249,115,22,.4);color:#f97316}
.tc-amarelo{background:rgba(234,179,8,.16);border-color:rgba(234,179,8,.4);color:#ca8a04}
.tc-vermelho{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#e06767}
.tc-neutro{background:var(--panel);color:var(--txt)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-height:90vh;overflow:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
.notagrid{display:flex;flex-direction:column;gap:10px}
.notacard{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel)}
.notacard.nc-ok{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.5)}
.nc-dest{font-weight:700;margin-bottom:6px}
.nc-info{display:flex;gap:14px;font-size:12px;color:var(--txt2);flex-wrap:wrap}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer}
.toggle span{padding:3px 12px;font-size:11px;font-weight:700;color:var(--txt2)}
.toggle .on{color:#fff}.toggle .yes.on{background:var(--ok)}.toggle .no.on{background:var(--late)}
.dow{display:inline-flex;gap:3px}
.dow b{width:26px;text-align:center;padding:3px 0;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--txt2)}
.dow b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px}
.kpi .n{font-size:22px;font-weight:700}.kpi .l{font-size:11px;color:var(--txt2);text-transform:uppercase;margin-top:2px}
.hint{font-size:12px;color:var(--txt2);background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;margin-bottom:12px}
.grpsep td{background:var(--panel2);font-weight:700;font-size:11px;text-transform:uppercase;color:var(--txt2);padding:6px 10px}
.iconbtn{background:transparent;border:none;color:var(--late);cursor:pointer;font-size:14px}
.empty{color:var(--txt2);padding:20px;text-align:center}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:min(460px,92vw)}
.modal-box h3{margin-bottom:6px}
.fld label{display:block;font-size:11px;color:var(--txt2);text-transform:uppercase;margin-bottom:5px}
.fld select,.fld input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:9px;border-radius:6px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--txt);padding:9px 16px;border-radius:8px;cursor:pointer}
.loading{color:var(--txt2);padding:30px;text-align:center}
</style>

<body data-theme="dark">

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <h2>📦 Controle de Envios</h2>
    <p>Entre com seu e-mail e senha.</p>
    <label>E-mail</label>
    <input type="email" id="email" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:column;height:100vh">
  <header class="topbar">
    <div class="tb-row">
      <div class="brand">📦 Controle de Envios</div>
      <div class="tb-tools">
        <input class="search" id="search" placeholder="Buscar..." oninput="render()">
        <span class="whoami" id="whoami"></span>
        <button class="tbtn" onclick="toggleTheme()">🌓</button>
        <button class="tbtn" onclick="doLogout()">Sair</button>
      </div>
    </div>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modaltt">
  <div class="modal-box">
    <h3>Transportadora por tipo</h3>
    <p style="color:var(--txt2);font-size:12px;margin-bottom:14px" id="ttnome"></p>
    <div id="ttbody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="fecharTranspTipo()">Cancelar</button>
      <button class="btn" onclick="salvarTranspTipo()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal" id="modalq">
  <div class="modal-box">
    <h3 id="qtitle">Adicionar avulso</h3>
    <p style="color:var(--txt2);font-size:12px;margin-bottom:14px">Adiciona envios pontuais na data selecionada, sem cadastrar fixo. Marque um ou vários pontos.</p>
    <div class="fld" style="margin-bottom:10px"><label>Tipo</label><select id="qtipo"><option>Quotes</option><option>Extra</option><option>Bateria</option></select></div>
    <input class="search" id="qbusca" placeholder="Filtrar destino..." style="width:100%;margin-bottom:8px" oninput="filtraQ()">
    <div id="qlista" style="max-height:38vh;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="fecharQuotesAvulso()">Cancelar</button>
      <button class="btn" onclick="addAvulso()">Adicionar marcados</button>
    </div>
  </div>
</div>

<script>

async function loadBase(){
  const t=await sb.from('env_transportadoras').select('*');
  TRANSP={}; (t.data||[]).forEach(x=>TRANSP[x.nome]=x.prazo_dias);
  const d=await sb.from('env_destinos').select('*').order('ordem').order('id');
  destinos=d.data||[];
  ANALISTAS=[...new Set(destinos.map(x=>x.analista).filter(Boolean))].sort();
  await refreshEnvios(true);
}
// baixa a janela de envios para o cache (usado no login e no sync em 2º plano)
async function refreshEnvios(force){
  const {data}=await sb.from('env_envios').select('*').gte('data',JANELA).order('data',{ascending:false}).order('id');
  if(!data) return false;
  const agora=Date.now(), locais={}; envios.forEach(r=>locais[r.id]=r);
  const merged=data.map(r=>{
    const loc=locais[r.id];
    if(loc && loc._touched && agora-loc._touched<4000) return loc;   // preserva edição recente (evita clarão)
    const d=destinos.find(x=>x.id===r.dest_id); if(d){r.grupo=d.grupo; r.eh_principal=!!d.eh_principal;}
    return r;
  });
  const antes=JSON.stringify(envios); envios=merged; return force || antes!==JSON.stringify(envios);
}
// sincroniza em 2º plano SEM travar a tela; só redesenha se algo mudou
function modalAberto(){return !!(window._assinando || (_scanner));}
function editandoAgora(){if(modalAberto())return true;const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA');}
async function syncBg(){
  if(syncing)return;
  if(editandoAgora()){setTimeout(syncBg,1500);return;}   // adia enquanto edita
  syncing=true;
  try{ if(await refreshEnvios(false)) { if(!editandoAgora()){ renderNav(); drawView(); } } }catch(e){} finally{ syncing=false; }
}

// gera envios que faltam para uma data (só admin tem permissão de insert)
async function ensureEnvios(data){
  if(perfil.papel!=='admin')return;
  if(data<HOJE)return;   // dia passado só mostra o que existe, nunca gera
  const wd=dow(data);
  const alvo=destinos.filter(d=>(d.dias||[]).includes(wd));
  if(!alvo.length)return;
  // fonte de verdade = banco (evita duplicar por causa do cache)
  const ex=await sb.from('env_envios').select('dest_id,envio').eq('data',data);
  const existentes=new Set((ex.data||[]).map(r=>r.dest_id+'|'+r.envio));
  const novos=alvo.filter(d=>!existentes.has(d.id+'|'+d.envio)).map(d=>({
    dest_id:d.id,data,filial:d.filial,dest:d.nome,grupo:d.grupo,eh_principal:d.eh_principal,
    envio:d.envio,analista:d.analista,analista_fixo:d.analista,transp:transpDe(d,d.envio),prazo:prazoDe(d,d.envio),quotes:false
  }));
  if(novos.length){
    const {data:ins}=await sb.from('env_envios').upsert(novos,{onConflict:'dest_id,data,envio',ignoreDuplicates:true}).select();
    if(ins&&ins.length){ ins.forEach(x=>{if(!envios.some(e=>e.id===x.id))envios.push(x);}); await logAcao(`gerou ${ins.length} envios para ${fmt(data)}`); }
  }
}
// edição otimista: muda o cache e a tela na hora, salva no banco em 2º plano
async function updateEnv(id,patch,acaoTxt){
  const r=envios.find(x=>x.id===id); if(!r)return false;
  const antes={}; Object.keys(patch).forEach(k=>antes[k]=r[k]);
  r._touched=Date.now(); Object.assign(r,patch); drawView();   // instantâneo
  const {error}=await sb.from('env_envios').update(patch).eq('id',id);
  if(error){ Object.assign(r,antes); drawView(); alert("Bloqueado: "+error.message); return false; }
  if(acaoTxt) logAcao(acaoTxt);                        // não bloqueia
  return true;
}

/* ===================== CÁLCULOS ===================== */
const destOf=id=>destinos.find(d=>d.id===id)||{};
const destOrdem=r=>{const d=destOf(r.dest_id);return d.fixo?-1000+(d.ordem||0):(d.ordem||9999);};
const ehFixo=r=>!!destOf(r.dest_id).fixo;
const transpDe=(d,tipo)=>(d&&d.transp_map&&d.transp_map[tipo])||(d?d.transp:null);
const prazoDe=(d,tipo)=>{const pm=d&&d.prazo_map;if(pm&&pm[tipo]!=null)return pm[tipo];const t=transpDe(d,tipo);return TRANSP[t]??0;};
function temFrete(r){const t=(r.transp||'').toUpperCase();return !!t&&t!=='SEM FRETE'&&t!=='SEM TRANSPORTADORA';}
function corTransp(t){t=(t||'').toUpperCase();
  if(t.includes('GOLLOG'))return 'tc-laranja';
  if(t.includes('CORREIOS'))return 'tc-amarelo';
  if(t.includes('BRASPRESS'))return 'tc-vermelho';
  return 'tc-neutro';}
function ordenar(list){return list.slice().sort((a,b)=>destOrdem(a)-destOrdem(b)||a.id-b.id);}
function prazo(r){if(r.prazo!=null&&r.prazo!=='')return +r.prazo;const d=destOf(r.dest_id);const pm=d&&d.prazo_map;if(pm&&pm[r.envio]!=null)return pm[r.envio];return TRANSP[r.transp]??0;}
// líquido: tara por caixa. caixa <=10kg abate 100g; caixa >10kg abate 1kg. classifica pelo peso médio.
function liq(vol,bruto){vol=+vol||0;bruto=+bruto||0;if(vol<=0||bruto<=0)return 0;const media=bruto/vol;const tara=media>10?1:0.1;return +(bruto-vol*tara).toFixed(2);}
const membros=(g,data)=>envios.filter(r=>r.grupo===g&&r.data===data);
const principal=(g,data)=>envios.find(r=>r.grupo===g&&r.eh_principal&&r.data===data);
function principalDef(g,data){const p=principal(g,data);return !!(p&&p.vol!=null&&p.bruto!=null);}   // fechado quando vol E bruto foram informados (inclusive 0)
function consol(g,data){const m=membros(g,data);const vol=m.reduce((s,r)=>s+(+r.vol||0),0);const bruto=+m.reduce((s,r)=>s+(+r.bruto||0),0).toFixed(2);return{vol,bruto,liq:liq(vol,bruto),pontos:m.length};}
function previsao(r){if(!r.data||prazo(r)===0)return"";const[y,m,d]=r.data.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+prazo(r));return isoLocal(dt);}
function atraso(r){const p=previsao(r);if(!p||!r.entrega)return null;return Math.round((new Date(r.entrega+'T00:00')-new Date(p+'T00:00'))/86400000);}
function status(r){if(!r.entrega)return{t:"EM TRÂNSITO",c:"b-info"};const a=atraso(r);if(a!==null&&a>0)return{t:"ATRASADA",c:"b-late"};return{t:"ENTREGUE",c:"b-ok"};}
function statusEnvio(r){if(r.entrega)return{t:'ENTREGUE',c:'st-ok'};const p=previsao(r);if(p&&HOJE>p)return{t:'ATRASADO',c:'st-late'};return{t:'EM TRÂNSITO',c:'st-transit'};}
function situacao(r){if(r.nf)return{t:"FATURADO",c:"b-fat"};if(principalDef(r.grupo,r.data))return{t:"LIBERADO",c:"b-ok"};return{t:"AGUARDANDO",c:"b-info"};}
const brl=v=>"R$ "+(+v||0).toFixed(2).replace(".",",");
const fmt=d=>d?d.split("-").reverse().join("/"):"—";
const busca=l=>{const q=(document.getElementById("search").value||"").toLowerCase();return l.filter(r=>((r.dest||r.nome||"")+(r.filial||"")+(r.nf||"")+(r.analista||"")+(r.grupo||"")).toLowerCase().includes(q));};

// render = desenha do cache (instantâneo) + sincroniza em 2º plano
function render(){
  const main=document.getElementById("main");
  const gw=main?main.querySelector('.grid-wrap'):null; const sTop=gw?gw.scrollTop:0; const wY=window.scrollY;
  corrigeAbaLib(); renderNav(); drawView(); if(active!=='log') syncBg();
  const rest=()=>{const g=document.getElementById("main")?.querySelector('.grid-wrap'); if(g&&sTop)g.scrollTop=sTop; if(wY)window.scrollTo(0,wY);};
  rest(); requestAnimationFrame(rest);
}
function drawView(){
  const main=document.getElementById("main");
  const gw=main.querySelector('.grid-wrap'); const sTop=gw?gw.scrollTop:0; const wY=window.scrollY;
  try{
    if(active==="admin")drawAdmin(main);
    else if(active==="destinos")viewDestinos(main);
    else if(active==="estoque")drawEstoque(main);
    else if(active==="fatur")drawFatur(main);
    else if(active==="analistas")drawAnalistas(main);
    else if(active==="hist")drawHist(main);
    else if(active==="log")viewLog(main);   // log busca do banco (não é cache)
    else if(active==="transp")viewTransp(main);
    else if(active==="liberacao")viewLiberacao(main);
  }catch(e){main.innerHTML='<div class="empty">Erro: '+e.message+'</div>';}
  const rest=()=>{const g=main.querySelector('.grid-wrap'); if(g&&sTop)g.scrollTop=sTop; if(wY)window.scrollTo(0,wY);};
  rest(); requestAnimationFrame(rest); setTimeout(rest,0);
}

/* ---- inline helpers ---- */
function inp(id,campo,val,type){const num=type==='number';const tp=num?'text':(type||'text');const cls=num?'num':(type==='date'?'':'txt');return `<input class="ci ${cls}" ${num?'inputmode="decimal"':''} type="${tp}" value="${val??''}" onchange="editEnv(${id},'${campo}',this.value)">`;}
function selInp(id,campo,val,opts){return `<select class="ci" onchange="editEnv(${id},'${campo}',this.value)">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select>`;}
function selAnalista(id,val){const opts=[...new Set([val,...ANALISTAS].filter(Boolean))];return `<select class="ci anasel" onchange="editEnv(${id},'analista',this.value)">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select>`;}
async function editEnv(id,campo,val){
  let v=val; if(['qtd','ana','custo','movimento','consumiveis'].includes(campo))v=parseFloat((val+"").replace(",","."))||0;
  const r=envios.find(x=>x.id===id);
  if(campo==='vol'||campo==='bruto'){
    const raw=(val+'').trim();
    v = raw==='' ? null : (parseFloat(raw.replace(',','.'))||0);
  }
  const patch={}; patch[campo]=v;
  if(campo==='vol'||campo==='bruto'){
    const other = campo==='vol' ? (r?r.bruto:null) : (r?r.vol:null);
    const ambosVazios = (v===null) && (other===null||other===undefined);
    patch.pesado_em = ambosVazios ? null : new Date().toISOString();
  }
  if(campo==='entrega'){
    const dv = v ? v : null;
    await updateEnv(id,{entrega:dv},`entrega real de "${r?r.dest:id}" → ${dv||'—'}`);
    if(r&&r.eh_principal){for(const sub of envios.filter(x=>x.grupo===r.grupo&&x.data===r.data&&!x.eh_principal)){await updateEnv(sub.id,{entrega:dv});}}
    return;
  }
  // financeiro lançando NF -> marca faturou
  if(campo==='nf'){patch.faturou=v?perfil.nome:null;patch.faturado_em=v?new Date().toISOString():null;}
  // trocar o TIPO de envio puxa a transportadora daquele tipo (se cadastrada)
  if(campo==='envio'){const d=destOf(r.dest_id);const t=transpDe(d,v);if(t)patch.transp=t;}
  // substituição de analista do dia
  if(campo==='analista'){
    const fixo=r?r.analista_fixo:null;
    if(v && fixo && v!==fixo){
      const m=prompt(`Substituição: ${v} no lugar de ${fixo}.\nMotivo (atestado, férias, folga...):`,'')||'';
      patch.substituicao_motivo=m;
      await updateEnv(id,patch,`SUBSTITUIÇÃO em "${r.dest}": ${v} no lugar de ${fixo}${m?' ('+m+')':''}`);
      return;
    } else { patch.substituicao_motivo=null; }
  }
  await updateEnv(id,patch,`editou ${campo} de "${r?r.dest:id}" → ${v}`);
}

  let h2='<tr class="sub">';GROUPS.forEach(g=>{if(collapsed[g.key]){h2+='<th>···</th>';return;}g.cols.forEach(c=>{const wmap={"QNTD ITENS":"wqt","QNTD ANALISADA":"wqa","Movimento":"wmc","Consumíveis":"wmc","Nota Fiscal":"wnfa","Analista":"wana","Transportadora":"wtr","Rastreio":"wrast","Data real entrega":"wdr"};h2+=`<th class="${c==='Destino'?'freeze':''} ${wmap[c]||''}">${c}</th>`;});});h2+='</tr></thead>';

  list.forEach(r=>{
    let volT=(r.vol!=null?r.vol:"—"),brutoT=(r.bruto!=null?r.bruto:"—"),liqT;
    if(r.eh_principal&&principalDef(r.grupo,r.data)){const c=consol(r.grupo,r.data);volT=`<b>${c.vol}</b>`;brutoT=`<b>${c.bruto}</b>`;liqT=`<b>${c.liq}</b>`;}
    else liqT=(r.vol!=null&&r.bruto!=null)?liq(r.vol,r.bruto):"—";
    const fixo=ehFixo(r);
    const mark=fixo?'':(r.eh_principal?`<span class="princ">◆</span>`:`<span class="subtag">└</span>`);

let unlocked={};
async function pedirLiberacao(id){
  const senha=prompt('Senha do gestor para liberar a edição:');
  if(senha===null||senha==='')return;
  try{
    const {data,error}=await sb.rpc('env_valida_gestor',{senha});
    if(error){alert('Erro ao validar a senha.');return;}
    if(data===true){unlocked[id]=true;const r=envios.find(x=>x.id===id);await logAcao(`GESTOR liberou edição travada de "${r?r.dest:id}"`);drawView();}

// monta o link de rastreio por transportadora
function urlRastreio(transp,cod){
  const t=(transp||'').toUpperCase();
  const c=encodeURIComponent(cod);
  if(t.includes('CORREIOS'))return 'https://rastreamento.correios.com.br/app/index.php?objetos='+c; // Correios preenche pela URL
  if(t.includes('BRASPRESS'))return 'https://www.braspress.com/';
  if(t.includes('GOLLOG'))return 'https://servicos.gollog.com.br/app/site/tracking';
  if(t.includes('JADLOG'))return 'https://www.jadlog.com.br/tracking';
  return 'https://www.google.com/search?q='+c;
}
// copia o código e abre o site da transportadora (SPAs não preenchem pela URL; é só colar/Ctrl+V)
function abrirRastreio(id){
  const r=envios.find(x=>x.id===id); if(!r||!r.rastreio)return;
  const cod=r.rastreio, transp=r.transp||'';
  try{navigator.clipboard&&navigator.clipboard.writeText(cod);}catch(e){}
  window.open(urlRastreio(transp,cod),'_blank');
  if(!transp.toUpperCase().includes('CORREIOS')) toast('Código copiado — cole no campo de busca do site (Ctrl+V).');
}
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3)';document.body.appendChild(el);}el.textContent=msg;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},3000);}
async function viewLog(main){

function viewTransp(main){
  const filial=window._tfilial||'';
  const d=destinos.find(x=>String(x.filial)===String(filial));
  const tipos=["Semanal","Quotes","Extra","Bateria"];
  let corpo='';
  if(d){

    let rows='';
    tipos.forEach(t=>{
      const tv=tm[t]||d.transp||'SEM FRETE';
      const pv=(pm[t]!=null?pm[t]:(TRANSP[tv]??0));
      rows+=`<tr>
        <td class="lft"><b>${t}</b></td>

        <td class="wnum"><input class="ci num" id="tp_${t}" type="number" value="${pv}"></td></tr>`;
    });
    corpo=`<div class="grid-wrap fit"><table class="tbl-fin" style="max-width:560px"><thead><tr class="solo"><th class="lft">Tipo de envio</th><th>Transportadora</th><th class="wnum">Prazo (dias)</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="margin-top:12px"><button class="qbtn" onclick="salvarTranspFilial(${d.id})">Salvar transportadoras da filial</button></div>`;
  } else if(filial){
    corpo=`<div class="empty">Filial não encontrada.</div>`;
  } else {
    corpo=`<div class="hint">Selecione uma filial acima para editar as transportadoras e prazos por tipo.</div>`;
  }
  const opts=destinos.slice().sort((a,b)=>(a.filial||'').localeCompare(b.filial||'',undefined,{numeric:true}))
    .map(x=>`<option value="${x.filial}" ${String(x.filial)===String(filial)?'selected':''}>${x.filial} · ${x.nome}</option>`).join("");
  main.innerHTML=`<div class="view-head"><div><h1>Transportadoras</h1><p>Transportadora e prazo por tipo, por filial. Vale para os próximos envios; o que já saiu fica congelado.</p></div>
    <div class="datebar"><label>Filial</label><select class="usel" style="padding:6px 8px" onchange="selTFilial(this.value)"><option value="">Selecione a filial</option>${opts}</select></div></div>
  ${corpo}`;
}
function selTFilial(v){window._tfilial=v;drawView();}
async function salvarTranspFilial(id){
  const d=destinos.find(x=>x.id===id); if(!d)return;
  const tipos=["Semanal","Quotes","Extra","Bateria"];
  const tm=Object.assign({},d.transp_map||{}), pm=Object.assign({},d.prazo_map||{});
  tipos.forEach(t=>{
    const sv=document.getElementById('tt_'+t), pv=document.getElementById('tp_'+t);
    if(sv)tm[t]=sv.value;
    if(pv)pm[t]=parseInt(pv.value)||0;
  });
  const novaTransp=tm['Semanal']||d.transp;
  await sb.from('env_destinos').update({transp_map:tm,prazo_map:pm,transp:novaTransp}).eq('id',id);
  d.transp_map=tm; d.prazo_map=pm; d.transp=novaTransp;
  // atualiza SÓ os envios de HOJE ainda não pesados (em aberto). Passado/pesado fica congelado.
  for(const e of envios.filter(x=>x.dest_id===id && x.data===HOJE && x.vol==null && !x.nf)){
    const nt=tm[e.envio]||novaTransp, np=pm[e.envio];
    const upd={}; if(nt&&nt!==e.transp)upd.transp=nt; if(np!=null&&np!==e.prazo)upd.prazo=np;
    if(Object.keys(upd).length){Object.assign(e,upd);await sb.from('env_envios').update(upd).eq('id',e.id);}
  }
  await logAcao(`atualizou transportadoras/prazos da filial ${d.filial}`);
  alert('Salvo! Vale para os próximos envios. O histórico ficou intacto.');
  drawView();
}
async function setSla(t,v){const prazo_dias=parseInt(v)||0;await sb.from('env_transportadoras').update({prazo_dias}).eq('nome',t);TRANSP[t]=prazo_dias;await logAcao(`SLA ${t}=${prazo_dias}`);}

  const {data}=await sb.from('env_envios').select('analista,analista_fixo,dest,filial,qtd,ana,vol,bruto');
  const rows=data||[];

function pct(atual,ant){if(!ant)return atual>0?{t:'novo',c:'#16a34a',up:true}:{t:'—',c:'#94a3b8',up:null};const v=Math.round(((atual-ant)/ant)*1000)/10;return {t:(v>=0?'+':'')+v+'%',c:v>=0?'#16a34a':'#dc2626',up:v>=0};}

  const hoje=new Date().toLocaleDateString('pt-BR');

  <style>

// extrai a CHAVE (44 dígitos) do texto do PDF
async function extrairChave(file){
  try{
    if(!window.pdfjsLib) return null;
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let txt='';
    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const c=await pg.getTextContent();txt+=' '+c.items.map(i=>i.str).join(' ');}
    const so=txt.replace(/\D/g,'');                  // só dígitos
    const m=so.match(/\d{44}/);                        // primeira sequência de 44 dígitos
    return m?m[0]:null;
  }catch(e){console.warn('extrair chave',e);return null;}
}

async function anexarNota(id,file){
  if(!file)return;
  if(file.type!=='application/pdf'){alert('Envie o PDF da nota (DANFE).');return;}
  const r=envios.find(x=>x.id===id); if(!r)return;
  toast('Lendo a nota...');
  const chave=await extrairChave(file);
  const path=`${r.data}/${r.id}_${Date.now()}.pdf`;
  const up=await sb.storage.from('notas').upload(path,file,{contentType:'application/pdf',upsert:true});
  if(up.error){alert('Erro ao subir o PDF: '+up.error.message);return;}
  const patch={nf_pdf_path:path}; if(chave)patch.nf_chave=chave;
  const {error}=await sb.from('env_envios').update(patch).eq('id',id);
  if(error){alert('Erro ao salvar: '+error.message);return;}
  Object.assign(r,patch);
  logAcao(`anexou PDF da nota em "${r.dest}"${chave?' (chave capturada)':' (sem chave detectada)'}`);
  toast(chave?'Nota anexada e chave capturada ✓':'Nota anexada (não achei a chave no PDF)');
  drawView();
}

async function removerNota(id){
  const r=envios.find(x=>x.id===id); if(!r||!r.nf_pdf_path)return;
  if(r.liberado){alert('Já liberado para o estoque — não dá para remover.');return;}
  if(!confirm('Remover o PDF desta nota? Você poderá anexar outro.'))return;
  await sb.storage.from('notas').remove([r.nf_pdf_path]);
  const {error}=await sb.from('env_envios').update({nf_pdf_path:null,nf_chave:null}).eq('id',id);
  if(error){alert('Erro: '+error.message);return;}
  r.nf_pdf_path=null; r.nf_chave=null;
  logAcao(`removeu PDF da nota em "${r.dest}"`);
  toast('PDF removido — anexe o correto.'); drawView();
}
async function verNota(id){
  const r=envios.find(x=>x.id===id); if(!r||!r.nf_pdf_path)return;
  const {data,error}=await sb.storage.from('notas').createSignedUrl(r.nf_pdf_path,120);

}

async function liberarSelecionados(){
  const ids=[...document.querySelectorAll('.libchk:checked')].map(c=>+c.value);
  if(!ids.length){alert('Selecione ao menos um.');return;}
  const agora=new Date().toISOString();
  let n=0;
  for(const id of ids){
    const r=envios.find(x=>x.id===id);
    if(!r||!elegivelLib(r))continue;   // trava dupla no servidor-cliente
    const {error}=await sb.from('env_envios').update({liberado:true,liberado_em:agora}).eq('id',id);
    if(!error){r.liberado=true;r.liberado_em=agora;n++;}
  }
  await logAcao(`liberou ${n} nota(s) para o estoque`);
  toast(`${n} liberada(s) para o estoque.`); drawView();
}
async function desliberar(id){
  const r=envios.find(x=>x.id===id); if(!r)return;
  if(!confirm('Cancelar a liberação desta nota?'))return;
  const {error}=await sb.from('env_envios').update({liberado:false,liberado_em:null}).eq('id',id);
  if(error){alert('Erro: '+error.message);return;}
  r.liberado=false;r.liberado_em=null; logAcao(`cancelou liberação de "${r.dest}"`); drawView();
}

let _scanner=null; let _libAba=null;
function periodoAgora(){const h=new Date().getHours(); if(h<12)return 'Manhã'; if(h>=15)return 'Tarde'; return null;}

function notasDaTransp(t){return ordenar(envios.filter(r=>r.liberado&&!r.cancelado&&r.transp===t));}

let _zxControls=null;
async function abrirScanner(){
  const box=document.getElementById('scanbox'); if(box)box.style.display='block';
  const Z=window.ZXingBrowser;
  if(!Z||!Z.BrowserMultiFormatReader){alert('Leitor não carregou. Use "Digitar chave".');return;}
  try{
    _scanner=new Z.BrowserMultiFormatReader();
    // usa câmera traseira quando disponível
    let devId=null;
    try{const devs=await Z.BrowserCodeReader.listVideoInputDevices();
      const tras=devs.find(d=>/back|traseira|rear|environment/i.test(d.label)); devId=(tras||devs[devs.length-1])?.deviceId;}catch(e){}
    _zxControls=await _scanner.decodeFromVideoDevice(devId||undefined,'reader',(result,err,controls)=>{
      if(result){ onChaveLida(result.getText()); }
    });
  }catch(e){ alert('Não consegui abrir a câmera: '+(e&&e.message||e)); }
}
function fecharScanner(){
  const box=document.getElementById('scanbox'); if(box)box.style.display='none';
  try{ if(_zxControls&&_zxControls.stop)_zxControls.stop(); }catch(e){}
  try{ if(_scanner&&_scanner.reset)_scanner.reset(); }catch(e){}
  _zxControls=null; _scanner=null;
}
function chaveManual(){const v=prompt('Digite/cole a chave de acesso (44 dígitos):');if(v)onChaveLida(v);}
function onChaveLida(txt){
  const chave=(txt||'').replace(/\D/g,'');
  if(chave.length<44){toast('Não parece uma chave (44 dígitos).');return;}
  const alvo=notasDaTransp(_libAba).find(r=>r.nf_chave===chave);
  if(!alvo){toast('❌ Chave não é dessa transportadora/liberação.');try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}return;}
  if(alvo._conf){toast('Já conferida: '+alvo.dest);return;}
  alvo._conf=true; try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  toast('✅ '+alvo.dest); drawView();
}

// ---- assinatura (entregou -> coletou) ----
let _sigStep=null, _sigData={entregou:null,coletou:null}, _sigCanvas=null, _sigCtx=null, _sigDraw=false;
function irAssinar(){
  const arr=notasDaTransp(_libAba); const confs=arr.filter(r=>r._conf);
  if(!confs.length){toast('Escaneie ao menos uma nota.');return;}
  fecharScanner();
  _sigData={entregou:null,coletou:null}; _sigStep='entregou'; window._assinando=true; desenhaAssinatura();
}
function desenhaAssinatura(){
  const box=document.getElementById('main'); if(!box)return;
  const quem=_sigStep==='entregou'?'ENTREGOU':'COLETOU';
  box.innerHTML=`<div class="view-head"><div><h1>Assinatura</h1></div></div><div class="modal" style="max-width:520px;margin:0 auto">
    <div class="modal-h"><b>Assinatura — quem ${quem==='ENTREGOU'?'entregou':'coletou'}</b></div>
    <input id="sigNome" class="ci txt" style="width:100%;border:1px solid var(--border);margin-bottom:8px" placeholder="Nome de quem ${quem==='ENTREGOU'?'entregou':'coletou'}">
    <canvas id="sigCanvas" width="470" height="180" style="width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;touch-action:none"></canvas>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="qbtn" onclick="limparAssinatura()">Limpar</button>
      <button class="qbtn" onclick="cancelaAssinatura()">Cancelar</button>
      <button class="qbtn" style="background:var(--ok);color:#062b14;font-weight:700;flex:1" onclick="confirmaAssinatura()">${_sigStep==='entregou'?'Próximo (coletou) →':'Finalizar coleta ✔️'}</button>
    </div></div>`;
  _sigCanvas=document.getElementById('sigCanvas'); _sigCtx=_sigCanvas.getContext('2d');
  _sigCtx.lineWidth=2.5; _sigCtx.lineCap='round'; _sigCtx.strokeStyle='#111';
  const pos=e=>{const rc=_sigCanvas.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-rc.left;const cy=(e.touches?e.touches[0].clientY:e.clientY)-rc.top;return {x:cx*(_sigCanvas.width/rc.width),y:cy*(_sigCanvas.height/rc.height)};};
  const start=e=>{_sigDraw=true;const p=pos(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!_sigDraw)return;const p=pos(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();e.preventDefault();};
  const end=()=>{_sigDraw=false;};
  _sigCanvas.onmousedown=start;_sigCanvas.onmousemove=move;window.onmouseup=end;
  _sigCanvas.ontouchstart=start;_sigCanvas.ontouchmove=move;_sigCanvas.ontouchend=end;
}
function cancelaAssinatura(){window._assinando=false;drawView();}
function limparAssinatura(){if(_sigCtx)_sigCtx.clearRect(0,0,_sigCanvas.width,_sigCanvas.height);}
function assinaturaVazia(){const b=_sigCtx.getImageData(0,0,_sigCanvas.width,_sigCanvas.height).data;for(let i=3;i<b.length;i+=4){if(b[i]!==0)return false;}return true;}
function confirmaAssinatura(){
  const nome=(document.getElementById('sigNome').value||'').trim();
  if(!nome){alert('Informe o nome.');return;}
  if(assinaturaVazia()){alert('Assine no quadro.');return;}
  const img=_sigCanvas.toDataURL('image/png');
  if(_sigStep==='entregou'){ _sigData.entregou={nome,img}; _sigStep='coletou'; desenhaAssinatura(); }
  else { _sigData.coletou={nome,img}; salvarColeta(); }
}
async function salvarColeta(){
  const arr=notasDaTransp(_libAba); const confs=arr.filter(r=>r._conf);
  if(!confs.length){window._assinando=false;drawView();return;}
  const notas=confs.map(r=>{const c=consol(r.grupo,r.data);return {dest:r.dest,nf:r.nf,peso:(c.pontos>1?c.liq:(r.vol!=null&&r.bruto!=null?liq(r.vol,r.bruto):null)),vol:(c.pontos>1?c.vol:r.vol)};});
  const reg={ periodo:periodoAgora(), transportadora:_libAba,
    entregou:_sigData.entregou.nome, coletou:_sigData.coletou.nome,
    assinatura_entregou:_sigData.entregou.img, assinatura_coletou:_sigData.coletou.img,
    notas, qtd_notas:notas.length, usuario:(perfil&&perfil.id)||null };
  const {error}=await sb.from('env_coletas').insert(reg);
  if(error){alert('Erro ao salvar coleta: '+error.message);return;}
  // baixa da liberação as notas coletadas (liberado=false = saíram)
  for(const r of confs){ await sb.from('env_envios').update({liberado:false}).eq('id',r.id); r.liberado=false; r._conf=false; }
  await logAcao(`coleta ${_libAba}: ${notas.length} nota(s), entregou ${reg.entregou}, coletou ${reg.coletou}`);
  toast('Coleta registrada ✔️');
  window._assinando=false; if(!notasDaTransp(_libAba).length)_libAba=null; corrigeAbaLib(); renderNav(); drawView();
}



/* ===================== AVULSO (Quotes / Extra, multi-PDV) ===================== */
function abrirQuotesAvulso(tipo){
  document.getElementById("qtipo").value=tipo||'Quotes';
  document.getElementById("qtitle").textContent=(tipo||'Quotes')+' avulso';
  document.getElementById("qbusca").value="";
  renderQlista("");
  document.getElementById("modalq").classList.add("open");
}
function abrirExtraAvulso(){abrirQuotesAvulso('Extra');}
function fecharQuotesAvulso(){document.getElementById("modalq").classList.remove("open");}
function renderQlista(f){
  f=(f||"").toLowerCase();
  const html=destinos.filter(d=>((d.filial||'')+' '+(d.nome||'')).toLowerCase().includes(f))
    .map(d=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer"><input type="checkbox" class="qchk" value="${d.id}"><span>${d.filial||''} · ${d.nome}</span></label>`).join("");
  document.getElementById("qlista").innerHTML=html||'<div class="empty">Nenhum destino.</div>';
}
function filtraQ(){renderQlista(document.getElementById("qbusca").value);}
async function addAvulso(){
  const tipo=document.getElementById("qtipo").value;
  const ids=[...document.querySelectorAll('.qchk:checked')].map(c=>+c.value);
  if(!ids.length){alert("Marque pelo menos um destino.");return;}
  const novos=[];
  ids.forEach(id=>{
    const d=destinos.find(x=>x.id===id); if(!d)return;
    if(envios.some(r=>r.dest_id===d.id&&r.data===selDate&&r.envio===tipo))return; // já existe
    novos.push({dest_id:d.id,data:selDate,filial:d.filial,dest:d.nome,grupo:d.grupo,eh_principal:d.eh_principal,envio:tipo,analista:d.analista,analista_fixo:d.analista,transp:transpDe(d,tipo),prazo:prazoDe(d,tipo),quotes:tipo==='Quotes'});
  });
  if(!novos.length){alert("Nada a adicionar (já existiam nesse dia).");return;}
  const {data:ins,error}=await sb.from('env_envios').upsert(novos,{onConflict:'dest_id,data,envio',ignoreDuplicates:true}).select();
  if(error){alert("Erro: "+error.message);return;}
  if(ins&&ins.length){ins.forEach(x=>{if(!envios.some(e=>e.id===x.id))envios.push(x);}); logAcao(`adicionou ${ins.length} ${tipo} avulso em ${fmt(selDate)}`);}
  fecharQuotesAvulso(); drawView();
}

/* ===================== TRANSPORTADORA POR TIPO ===================== */
let _transpDestId=null;
function abrirTranspTipo(id){
  _transpDestId=id;
  const d=destinos.find(x=>x.id===id); if(!d)return;
  const map=d.transp_map||{};
  const rows=ENVIOS_TIPO.map(t=>{
    const cur=map[t]||'';
    const opts=['<option value="">(usa padrão: '+(d.transp||'—')+')</option>'].concat(Object.keys(TRANSP).map(x=>`<option value="${x}" ${x===cur?'selected':''}>${x}</option>`)).join("");
    return `<div class="fld" style="margin-bottom:8px"><label>${t}</label><select data-tipo="${t}">${opts}</select></div>`;
  }).join("");
  document.getElementById("ttbody").innerHTML=rows;
  document.getElementById("ttnome").textContent=(d.filial||'')+' · '+d.nome;
  document.getElementById("modaltt").classList.add("open");
}
function fecharTranspTipo(){document.getElementById("modaltt").classList.remove("open");}
async function salvarTranspTipo(){
  const d=destinos.find(x=>x.id===_transpDestId); if(!d){fecharTranspTipo();return;}
  const map={};
  document.querySelectorAll('#ttbody select').forEach(sel=>{const t=sel.getAttribute('data-tipo');if(sel.value)map[t]=sel.value;});
  const novaTransp = map['Semanal'] || d.transp;      // "Transp." fixa segue o Semanal
  await sb.from('env_destinos').update({transp_map:map, transp:novaTransp}).eq('id',d.id);
  d.transp_map=map; d.transp=novaTransp;
  // reflete nos envios já existentes desse destino (admin)
  for(const e of envios.filter(x=>x.dest_id===d.id)){
    const nt = map[e.envio] || novaTransp;
    if(nt && nt!==e.transp){ e.transp=nt; await sb.from('env_envios').update({transp:nt}).eq('id',e.id); }
  }
  await logAcao(`definiu transportadora por tipo em "${d.nome}"`);
  fecharTranspTipo(); drawView();
}

/* ===================== MISC ===================== */
function toggleTheme(){const b=document.body;b.dataset.theme=b.dataset.theme==="dark"?"light":"dark";}
boot();
